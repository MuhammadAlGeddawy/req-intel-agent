services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: requirements_agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d requirements_agent -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-service:
    build: ./backend
    ports:
      - "8081:8000"
    # REQUIRED: Create backend/config/.env from backend/config/.env.example
    #   cp backend/config/.env.example backend/config/.env
    # Then fill in your OPENROUTER_API_KEY
    env_file:
      - backend/config/.env
    volumes:
      - agent-data:/app/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=requirements_agent
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agent-data:
  postgres-data:
